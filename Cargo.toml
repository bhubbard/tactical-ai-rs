[package]
name = "tactical-ai-rs"
version = "0.1.1"
edition = "2024"
description = "Pure Rust tactical influence maps, spatial reasoning, cover finding, and flanking pathfinder from Game AI Pro"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bhubbard/tactical-ai-rs"
keywords = ["game-ai", "influence-map", "spatial-reasoning", "pathfinding", "tactical"]
categories = ["game-development", "algorithms"]

[dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
